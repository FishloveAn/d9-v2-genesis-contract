[package]
name = "d9-genesis-contract"
version = "0.1.0-rc.7"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/D-Nine-Chain/d9-v2-genesis-contract"
description = "Versioned D9 native-genesis contracts and shared conformance fixtures"

[dependencies]
sp-core = { version = "=43.0.0", features = ["std"] }
sp-runtime = { version = "=48.0.0", features = ["std"] }
frame-support = { version = "=48.0.0", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
serde_path_to_error = "0.1"
schemars = "=0.8.22"
sha2 = "0.10"
# D9-400 CS3-1 / decision A (yvan 2026-09-14 05:46 UTC): ed25519 prime-order key validation.
# Pinned to the version and registry source Cargo.lock already carries through schnorrkel
# and ed25519-zebra; no default features are needed for decompress/compress/is_torsion_free.
curve25519-dalek = { version = "=4.1.3", default-features = false }
